aid: walker-and-co
name: Walker & Co.
description: >-
  Walker & Company Brands is a health and beauty products company founded in 2013 by
  Tristan Walker, best known for Bevel, an end-to-end shaving and grooming system designed
  for people of color, and for the Form hair-care line. Backed by Andreessen Horowitz (a16z)
  and others, the company was acquired by Procter & Gamble in 2018 and now operates as a
  consumer brand whose direct-to-consumer storefront runs on Shopify at getbevel.com. It is
  a consumer packaged goods company with no first-party developer API program; it was added
  to the API Evangelist network as an a16z portfolio lead. This profile captures its real
  public web surface (storefront, security.txt, well-known documents, P&G legal and
  vulnerability-disclosure programs) rather than an API product.
